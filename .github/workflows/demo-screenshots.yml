name: Demonstration screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Screenshot demo dashboard (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture deterministic demonstration scenarios
        run: python scripts/capture_demo_screenshots.py
      - name: Update README screenshots on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          cp dist/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
            exit 0
          fi
          git commit -m "docs: refresh automated demo screenshots [skip ci]"
          git push origin HEAD:main

      - name: Upload PNG screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wxcommand-pro-demo-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: error
