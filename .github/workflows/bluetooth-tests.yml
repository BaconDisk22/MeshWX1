name: Bluetooth regression tests

on:
  push:
    branches:
      - feature/bluetooth-radio-connections
      - feature/phase2-radio-reliability
      - feature/phase3-stability-release
  pull_request:
    paths:
      - 'app/bluetooth_discovery.py'
      - 'app/transmit.py'
      - 'app/web/bluetooth_routes.py'
      - 'app/web/routes.py'
      - 'app/web/templates/settings.html'
      - 'tests/test_bluetooth_connections.py'
      - 'tests/test_radio_tools.py'
      - 'tests/test_phase3.py'
      - 'app/web/radio_tools.py'
      - 'app/network_discovery.py'
      - 'app/web/templates/base.html'
      - 'requirements*.txt'
      - '.github/workflows/bluetooth-tests.yml'
  workflow_dispatch:

jobs:
  bluetooth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile modified modules
        run: python -m compileall -q app
      - name: Run radio regression tests
        run: python -m pytest -q tests
